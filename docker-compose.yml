services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fpanda
      MYSQL_USER: fpanda
      MYSQL_PASSWORD: fpanda
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufpanda", "-pfpanda"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
      target: migrate
    profiles: ["tools"]
    command: ["-dir", ".", "mysql", "root:root@tcp(mysql:3306)/fpanda?parseTime=true", "up"]
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      APP_ADDR: ":8080"
      APP_DB_HOST: mysql
      APP_DB_PORT: "3306"
      APP_DB_USER: fpanda
      APP_DB_PASSWORD: fpanda
      APP_DB_NAME: fpanda
      APP_COOKIE_SECURE: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/app
      - backend_gocache:/root/.cache/go-build
      - backend_gomod:/go/pkg/mod
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8080"
    ports:
      - "5183:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_gocache:
  backend_gomod:
  frontend_node_modules:

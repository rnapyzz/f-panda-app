name: Deploy

# main のテスト（CI）が通ったら、本番にデプロイする（docs/deploy.md「3. リリース」）。手動でも実行できる。
# AWS の鍵は置かない。OIDC でデプロイ用のロール（deploy/aws/fpanda.yaml）を受け取る。
# リポジトリの Variables（AWS_REGION・AWS_DEPLOY_ROLE_ARN・AWS_INSTANCE_ID・ECR_REGISTRY・DEPLOY_BUCKET・APP_DOMAIN・ACME_EMAIL）が
# 入っていなければ何もしない（本番を作る前のリポジトリでも失敗にしない）。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 同時に2つは動かさない（後のものは前のものが終わるのを待つ）
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # AWS に渡す OIDC のトークンの中身（sub・aud・iss）を表示する。ロールを受け取れないときの調査用（トークンそのものは出さない）
      - name: OIDC のトークンの中身
        run: |
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          payload="$(cut -d. -f2 <<<"$token" | tr '_-' '/+')"
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" | jq '{sub, aud, iss, ref, event_name}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # 本番は Arm（t4g）。ビルドは x86 のランナーで行い、Go はクロス コンパイルする（エミュレーションは最後の段だけ）
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: api のイメージ
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/fpanda-api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: web のイメージ
        uses: docker/build-push-action@v6
        with:
          context: web
          target: prod
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/fpanda-web:${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: サーバーでデプロイ（SSM Run Command）
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
        run: |
          # サーバーのファイル（compose・Caddyfile・スクリプト）も、このコミットのものに置き換える（S3 経由で渡す）
          key="bundles/${SHA}.tgz"
          tar -czf /tmp/bundle.tgz -C deploy/server $(ls deploy/server)
          aws s3 cp /tmp/bundle.tgz "s3://${DEPLOY_BUCKET}/${key}" --only-show-errors
          params="$(jq -nc \
            --arg src "s3://${DEPLOY_BUCKET}/${key}" --arg tag "$SHA" --arg registry "$ECR_REGISTRY" --arg region "$AWS_REGION" \
            --arg domain "$APP_DOMAIN" --arg email "$ACME_EMAIL" \
            '{commands: [
              "set -euo pipefail",
              "mkdir -p /opt/fpanda",
              "aws s3 cp \($src) /tmp/fpanda-bundle.tgz --region \($region) --only-show-errors",
              "tar -xzf /tmp/fpanda-bundle.tgz -C /opt/fpanda --no-same-owner && rm -f /tmp/fpanda-bundle.tgz",
              "chmod 700 /opt/fpanda && chmod 755 /opt/fpanda/*.sh && chmod 644 /opt/fpanda/my.cnf /opt/fpanda/Caddyfile /opt/fpanda/compose.prod.yaml",
              "ECR_REGISTRY=\($registry) AWS_REGION=\($region) APP_DOMAIN=\($domain) ACME_EMAIL=\($email) /opt/fpanda/deploy.sh \($tag)"
            ], executionTimeout: ["1200"]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "fpanda deploy ${SHA:0:12}" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "command: $command_id"

          # 終わるまで待つ（最大 20 分）
          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "--- サーバーの出力 ---"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true
          echo "--- エラー出力 ---"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true
          echo "status: $status"
          test "$status" = Success

      - name: 結果
        run: |
          echo "デプロイしました: https://${{ vars.APP_DOMAIN }}（${SHA:0:12}）" >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  migrations:
    name: Migrations (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fpanda
          MYSQL_USER: fpanda
          MYSQL_PASSWORD: fpanda
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: fpanda
      DB_PASSWORD: fpanda
      DB_NAME: fpanda
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: migrate up
        run: go run ./cmd/migrate up
      - name: migrate up（再実行で変更がないこと）
        run: go run ./cmd/migrate up 2>&1 | tee /tmp/migrate.log && grep -q "no pending migrations" /tmp/migrate.log
      - name: migrate status
        run: |
          go run ./cmd/migrate status | tee /tmp/status.log
          if grep -q "^pending" /tmp/status.log; then exit 1; fi

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: lint
        run: npm run lint
      - name: build（型チェックを含む）
        run: npm run build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [api, migrations, web]
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker compose build
      - name: up
        run: docker compose up -d
      - name: /api/health が ok を返すこと
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health | tee /tmp/health.json; then
              grep -q '"database":"ok"' /tmp/health.json && exit 0
            fi
            sleep 2
          done
          exit 1
      - name: トップページが表示されること
        run: curl -fsS http://localhost:8080/ | grep -q "<title>F-Panda</title>"
      - name: logs
        if: failure()
        run: docker compose logs
      - name: down
        if: always()
        run: docker compose down -v

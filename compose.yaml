# 開発環境。`docker compose up --build` で起動し、http://localhost:${APP_PORT:-8080} を開く。

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_USER: ${MYSQL_USER:-fpanda}
  DB_PASSWORD: ${MYSQL_PASSWORD:-fpanda}
  DB_NAME: ${MYSQL_DATABASE:-fpanda}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fpanda}
      MYSQL_USER: ${MYSQL_USER:-fpanda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fpanda}
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build: ./api
    command: ["migrate", "up"]
    environment:
      <<: *db-env
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./api
    environment:
      <<: *db-env
      HTTP_ADDR: ":8080"
      TZ: Asia/Tokyo
      # 通知を送る Slack の Incoming Webhook（秘密情報。.env などで渡す。空なら Slack には送らない）
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # 通知の本文に載せるアプリの URL
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${APP_PORT:-8080}}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      target: dev
    volumes:
      - ./web:/app
      # コンテナ内の node_modules をホストの node_modules で上書きしない
      - web-node-modules:/app/node_modules

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  db-data:
  web-node-modules:

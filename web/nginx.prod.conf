# 本番用（docs/architecture.md「本番環境（AWS）」）: ビルドした画面を配信し、/api は同じタスクの API コンテナに転送する。
# HTTPS は ALB で終端する。ALB からは HTTP で受け、X-Forwarded-Proto で HTTPS だったかを判定する。

# HTTPS（ALB で終端）で来たときだけ HSTS を付ける
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 50m; # CSV 取込用（実績の明細は 50MB まで）

    # HTTP のヘッダー（docs/architecture.md「HTTP のヘッダー」）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security $hsts always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080; # 同じタスク（awsvpc）の API コンテナ
        proxy_set_header Host $http_host;
        # ALB が付けた X-Forwarded-For・X-Forwarded-Proto をそのまま渡す（API は最後の値を接続元とみなす）
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ハッシュ付きのファイルは長くキャッシュする
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 画面のルーティングは index.html に任せる（キャッシュしない）
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security $hsts always;
    }
}

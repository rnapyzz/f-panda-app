<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>F-Panda</title>
  <!-- 背景: アプリのテーマ色（indigo-600） -->
  <rect width="64" height="64" rx="14" fill="#4f46e5"/>
  <!-- 耳 -->
  <circle cx="17" cy="18" r="9" fill="#111827"/>
  <circle cx="47" cy="18" r="9" fill="#111827"/>
  <!-- 顔 -->
  <ellipse cx="32" cy="35" rx="22" ry="20" fill="#fff"/>
  <!-- 目のまわり・目 -->
  <ellipse cx="23.5" cy="32" rx="5.5" ry="7.5" transform="rotate(-28 23.5 32)" fill="#111827"/>
  <ellipse cx="40.5" cy="32" rx="5.5" ry="7.5" transform="rotate(28 40.5 32)" fill="#111827"/>
  <circle cx="24.5" cy="31" r="2" fill="#fff"/>
  <circle cx="39.5" cy="31" r="2" fill="#fff"/>
  <!-- 鼻 -->
  <ellipse cx="32" cy="40" rx="3.2" ry="2.3" fill="#111827"/>
  <!-- 上昇トレンドの矢印（Finance） -->
  <path d="M22 50 L29 45 L34 48 L42 41" fill="none" stroke="#10b981" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37.5 40.5 L43 40 L42.5 45.5" fill="none" stroke="#10b981" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
